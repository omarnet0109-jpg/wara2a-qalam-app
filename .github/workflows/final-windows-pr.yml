name: Verify Final Windows Release

on:
  pull_request:
    branches: [main]

jobs:
  verify-windows-final:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Prepare clean final patch payload
        shell: pwsh
        run: |
          python .\windows-builder\repair_chunk.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item 'windows-builder/final_patch.b64.*' -Force -ErrorAction SilentlyContinue
          $parts = Get-ChildItem 'windows-builder/final_clean.b64.*' | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 clean patch parts, found $($parts.Count)" }
          for ($i=0; $i -lt $parts.Count; $i++) { Copy-Item $parts[$i].FullName ("windows-builder/final_patch.b64.{0}" -f $i) -Force }
      - name: Build test package
        shell: pwsh
        run: .\windows-builder\final_ci.ps1
      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: BashmohandesOmar-Final-Windows-v9.1
          path: |
            Program-Source-Final.zip
            Program-Setup-Final.exe
            Program-Portable-Final.zip
          if-no-files-found: error
          retention-days: 30
