name: Build Bashmohandes Omar Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [bashmohandes-omar-windows-build]
    paths:
      - 'windows-builder/**'
      - '.github/workflows/bashmohandes-omar-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows-builder/**'
      - '.github/workflows/bashmohandes-omar-windows.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'windows-builder/source.b64.*' | Sort-Object Name
          if ($parts.Count -ne 12) { throw "Expected 12 source parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('windows-builder/source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'windows-builder/source.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '20aeeb9431d3a9687eb120a0f16460ee8fb9a01d43ec9d8686a7dde43e07df0e') { throw "Source archive hash mismatch: $hash" }
          New-Item -ItemType Directory -Force 'windows-builder/src' | Out-Null
          Expand-Archive 'windows-builder/source.zip' 'windows-builder/src' -Force
          $root = (Resolve-Path 'windows-builder/src').Path
          if (-not (Test-Path "$root\app\main.py")) { throw 'app/main.py is missing.' }
          "APP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:APP_ROOT\requirements.txt"
          python -m pip install pillow nuitka ordered-set zstandard

      - name: Prepare branding and installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from PIL import Image
          from pathlib import Path
          import hashlib, os, re
          root = Path(os.environ['APP_ROOT'])
          brand_dir = root / 'assets' / 'branding'
          source = Image.open(brand_dir / 'brand.jpg').convert('RGB')
          logo = brand_dir / 'bashmohandes_omar_logo.png'
          icon = brand_dir / 'bashmohandes_omar.ico'
          source.save(logo, optimize=True)
          source.save(icon, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          digest = hashlib.sha256(logo.read_bytes()).hexdigest()
          brand_py = root / 'app' / 'brand.py'
          text = brand_py.read_text(encoding='utf-8')
          text, count = re.subn(r'LOGO_SHA256\s*=\s*"[^"]*"', f'LOGO_SHA256 = "{digest}"', text)
          if count != 1: raise RuntimeError('Could not update LOGO_SHA256')
          brand_py.write_text(text, encoding='utf-8')
          iss = root / 'create_setup.iss'
          s = iss.read_text(encoding='utf-8')
          s = re.sub(r'\[Languages\]\s*Name:\s*"arabic";\s*MessagesFile:[^\r\n]*\s*', '', s, flags=re.I)
          s = s.replace('DefaultDirName={autopf}\\BashmohandesOmar', 'DefaultDirName={localappdata}\\Programs\\BashmohandesOmar')
          iss.write_text(s, encoding='utf-8-sig')
          print('Brand SHA256:', digest)
          '@ | Set-Content "$env:RUNNER_TEMP\prepare_brand.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\prepare_brand.py"
          if (-not (Test-Path "$env:APP_ROOT\assets\branding\bashmohandes_omar.ico")) { throw 'Icon creation failed.' }

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q "$env:APP_ROOT\app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone Windows executable
        shell: pwsh
        working-directory: ${{ env.APP_ROOT }}
        run: |
          python -m nuitka `
            --assume-yes-for-downloads `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --include-data-dir=assets=assets `
            --windows-icon-from-ico="assets\branding\bashmohandes_omar.ico" `
            --product-name="الباشمهندس عمر" `
            --file-description="استوديو المواقع الاحترافي" `
            --product-version=9.0.0.0 `
            --file-version=9.0.0.0 `
            --copyright="جميع الحقوق محفوظة - الباشمهندس عمر - 01158022519" `
            --output-filename="BashmohandesOmar.exe" `
            app\main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'BashmohandesOmar.exe')) { throw 'BashmohandesOmar.exe was not created.' }
          $bytes = [IO.File]::ReadAllBytes('BashmohandesOmar.exe')
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Windows executable.' }
          Get-Item 'BashmohandesOmar.exe' | Format-List Name,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        working-directory: ${{ env.APP_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc 'create_setup.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem 'installer_output\BashmohandesOmar_Setup_v9.exe' -ErrorAction Stop
          Copy-Item $setup.FullName "$env:GITHUB_WORKSPACE\BashmohandesOmar_Setup_v9.exe" -Force
          $bytes = [IO.File]::ReadAllBytes("$env:GITHUB_WORKSPACE\BashmohandesOmar_Setup_v9.exe")
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Setup.exe.' }

      - name: Silent install smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'BashmohandesOmarInstalled'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'BashmohandesOmar_Setup_v9.exe'
          $proc = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)." }
          $exe = Join-Path $installDir 'BashmohandesOmar.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable was not found.' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Installed file is not a valid PE executable.' }
          Get-Item $exe | Format-List FullName,Length

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BashmohandesOmar-Windows10-Setup-v9
          path: BashmohandesOmar_Setup_v9.exe
          if-no-files-found: error
          retention-days: 30
