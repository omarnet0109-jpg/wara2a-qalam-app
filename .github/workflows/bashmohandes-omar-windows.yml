name: Build Bashmohandes Omar Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [bashmohandes-omar-windows-build]
    paths:
      - 'windows-builder/**'
      - '.github/workflows/bashmohandes-omar-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows-builder/**'
      - '.github/workflows/bashmohandes-omar-windows.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Recover and verify clean source archive
        shell: pwsh
        run: |
          @'
          import base64, hashlib, itertools, os, pathlib, subprocess

          expected = '20aeeb9431d3a9687eb120a0f16460ee8fb9a01d43ec9d8686a7dde43e07df0e'
          repo = pathlib.Path.cwd()
          paths = [f'windows-builder/source.b64.{i:02d}' for i in range(12)]

          def git(*args):
              return subprocess.check_output(['git', *args], cwd=repo, text=True, encoding='utf-8', errors='strict')

          versions = []
          for path in paths:
              commits = [x.strip() for x in git('rev-list', '--all', '--', path).splitlines() if x.strip()]
              vals = []
              seen = set()
              for commit in commits:
                  try:
                      value = git('show', f'{commit}:{path}').strip()
                  except subprocess.CalledProcessError:
                      continue
                  if value not in seen:
                      seen.add(value)
                      vals.append(value)
              if not vals:
                  raise RuntimeError(f'No historical versions found for {path}')
              print(path, 'versions:', len(vals), 'lengths:', [len(v) for v in vals])
              versions.append(vals)

          attempts = 0
          found = None
          for combo in itertools.product(*versions):
              attempts += 1
              text = ''.join(combo)
              try:
                  raw = base64.b64decode(text, validate=True)
              except Exception:
                  continue
              if hashlib.sha256(raw).hexdigest() == expected:
                  found = raw
                  break

          print('combinations tested:', attempts)
          if found is None:
              raise RuntimeError('Could not recover source archive matching expected SHA256')

          out = repo / 'windows-builder' / 'source.zip'
          out.write_bytes(found)
          print('Recovered ZIP:', len(found), 'bytes, SHA256:', hashlib.sha256(found).hexdigest())
          '@ | Set-Content "$env:RUNNER_TEMP\recover_source.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\recover_source.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force 'windows-builder/src' | Out-Null
          Expand-Archive 'windows-builder/source.zip' 'windows-builder/src' -Force
          $root = (Resolve-Path 'windows-builder/src').Path
          if (-not (Test-Path "$root\app\main.py")) { throw 'app/main.py missing after recovery' }
          if (-not (Test-Path "$root\assets\branding\brand.jpg")) { throw 'brand.jpg missing after recovery' }
          "APP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:APP_ROOT\requirements.txt"
          python -m pip install pillow nuitka ordered-set zstandard

      - name: Prepare logo icon and installer
        shell: pwsh
        run: |
          @'
          from PIL import Image
          from pathlib import Path
          import hashlib, os, re
          root = Path(os.environ['APP_ROOT'])
          b = root / 'assets' / 'branding'
          im = Image.open(b / 'brand.jpg').convert('RGB')
          logo = b / 'bashmohandes_omar_logo.png'
          icon = b / 'bashmohandes_omar.ico'
          im.save(logo, optimize=True)
          im.save(icon, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          digest = hashlib.sha256(logo.read_bytes()).hexdigest()
          p = root / 'app' / 'brand.py'
          t = p.read_text(encoding='utf-8')
          t, n = re.subn(r'LOGO_SHA256\s*=\s*"[^"]*"', f'LOGO_SHA256 = "{digest}"', t)
          if n != 1:
              raise RuntimeError('LOGO_SHA256 patch failed')
          p.write_text(t, encoding='utf-8')
          iss = root / 'create_setup.iss'
          s = iss.read_text(encoding='utf-8')
          s = re.sub(r'\[Languages\]\s*Name:\s*"arabic";\s*MessagesFile:[^\r\n]*\s*', '', s, flags=re.I)
          s = s.replace('DefaultDirName={autopf}\\BashmohandesOmar', 'DefaultDirName={localappdata}\\Programs\\BashmohandesOmar')
          iss.write_text(s, encoding='utf-8-sig')
          print('Brand SHA256:', digest)
          '@ | Set-Content "$env:RUNNER_TEMP\prepare.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\prepare.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q "$env:APP_ROOT\app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone Windows EXE
        shell: pwsh
        working-directory: ${{ env.APP_ROOT }}
        run: |
          python -m nuitka `
            --assume-yes-for-downloads `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --include-data-dir=assets=assets `
            --windows-icon-from-ico="assets\branding\bashmohandes_omar.ico" `
            --product-name="الباشمهندس عمر" `
            --file-description="استوديو المواقع الاحترافي" `
            --product-version=9.0.0.0 `
            --file-version=9.0.0.0 `
            --copyright="جميع الحقوق محفوظة - الباشمهندس عمر - 01158022519" `
            --output-filename="BashmohandesOmar.exe" `
            app\main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'BashmohandesOmar.exe')) { throw 'EXE build failed' }
          $bytes = [IO.File]::ReadAllBytes('BashmohandesOmar.exe')
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Windows EXE' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE
        shell: pwsh
        working-directory: ${{ env.APP_ROOT }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup missing' }
          & $iscc 'create_setup.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = 'installer_output\BashmohandesOmar_Setup_v9.exe'
          if (-not (Test-Path $built)) { throw 'Setup EXE was not created' }
          Copy-Item $built "$env:GITHUB_WORKSPACE\BashmohandesOmar_Setup_v9.exe" -Force
          $bytes = [IO.File]::ReadAllBytes("$env:GITHUB_WORKSPACE\BashmohandesOmar_Setup_v9.exe")
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Setup EXE' }

      - name: Silent install smoke test
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'BashmohandesOmarInstalled'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'BashmohandesOmar_Setup_v9.exe'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $exe = Join-Path $dir 'BashmohandesOmar.exe'
          if (-not (Test-Path $exe)) { throw 'Installed EXE missing' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Installed EXE invalid' }
          Write-Host "Verified installed EXE: $exe"

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BashmohandesOmar-Windows10-Setup-v9
          path: BashmohandesOmar_Setup_v9.exe
          if-no-files-found: error
          retention-days: 30
