name: Build Bashmohandes Omar Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [bashmohandes-omar-windows-build]
    paths:
      - 'windows-builder/**'
      - '.github/workflows/bashmohandes-omar-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows-builder/**'
      - '.github/workflows/bashmohandes-omar-windows.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore and verify source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'windows-builder/source.b64.*' | Sort-Object Name
          if ($parts.Count -ne 12) { throw "Expected 12 source parts, found $($parts.Count)." }
          $chunks = @()
          foreach ($p in $parts) {
            $s = (Get-Content $p.FullName -Raw).Trim()
            if ($p.Name -eq 'source.b64.08' -and $s.Length -gt 16000) { $s = $s.Substring(0,16000) }
            $chunks += $s
          }
          $b64 = $chunks -join ''
          [IO.File]::WriteAllBytes('windows-builder/source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'windows-builder/source.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '20aeeb9431d3a9687eb120a0f16460ee8fb9a01d43ec9d8686a7dde43e07df0e') { throw "Source ZIP hash mismatch: $hash" }
          New-Item -ItemType Directory -Force 'windows-builder/src' | Out-Null
          Expand-Archive 'windows-builder/source.zip' 'windows-builder/src' -Force
          $root = (Resolve-Path 'windows-builder/src').Path
          if (-not (Test-Path "$root\app\main.py")) { throw 'app/main.py missing' }
          "APP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:APP_ROOT\requirements.txt"
          python -m pip install pillow nuitka ordered-set zstandard

      - name: Prepare logo, icon and installer
        shell: pwsh
        run: |
          @'
          from PIL import Image
          from pathlib import Path
          import hashlib, os, re
          root = Path(os.environ['APP_ROOT'])
          b = root/'assets'/'branding'
          im = Image.open(b/'brand.jpg').convert('RGB')
          logo = b/'bashmohandes_omar_logo.png'
          icon = b/'bashmohandes_omar.ico'
          im.save(logo, optimize=True)
          im.save(icon, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          digest = hashlib.sha256(logo.read_bytes()).hexdigest()
          p = root/'app'/'brand.py'
          t = p.read_text(encoding='utf-8')
          t,n = re.subn(r'LOGO_SHA256\s*=\s*"[^"]*"', f'LOGO_SHA256 = "{digest}"', t)
          if n != 1: raise RuntimeError('LOGO_SHA256 patch failed')
          p.write_text(t, encoding='utf-8')
          iss = root/'create_setup.iss'
          s = iss.read_text(encoding='utf-8')
          s = re.sub(r'\[Languages\]\s*Name:\s*"arabic";\s*MessagesFile:[^\r\n]*\s*', '', s, flags=re.I)
          s = s.replace('DefaultDirName={autopf}\\BashmohandesOmar','DefaultDirName={localappdata}\\Programs\\BashmohandesOmar')
          iss.write_text(s, encoding='utf-8-sig')
          '@ | Set-Content "$env:RUNNER_TEMP\prepare.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\prepare.py"

      - name: Validate source
        shell: pwsh
        run: python -m compileall -q "$env:APP_ROOT\app"

      - name: Build Windows EXE
        shell: pwsh
        working-directory: ${{ env.APP_ROOT }}
        run: |
          python -m nuitka `
            --assume-yes-for-downloads `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --include-data-dir=assets=assets `
            --windows-icon-from-ico="assets\branding\bashmohandes_omar.ico" `
            --product-name="الباشمهندس عمر" `
            --file-description="استوديو المواقع الاحترافي" `
            --product-version=9.0.0.0 `
            --file-version=9.0.0.0 `
            --copyright="جميع الحقوق محفوظة - الباشمهندس عمر - 01158022519" `
            --output-filename="BashmohandesOmar.exe" `
            app\main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'BashmohandesOmar.exe')) { throw 'EXE build failed' }
          $b=[IO.File]::ReadAllBytes('BashmohandesOmar.exe')
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw 'Invalid EXE' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        working-directory: ${{ env.APP_ROOT }}
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup missing' }
          & $iscc 'create_setup.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'installer_output\BashmohandesOmar_Setup_v9.exe' "$env:GITHUB_WORKSPACE\BashmohandesOmar_Setup_v9.exe" -Force

      - name: Silent install smoke test
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'BashmohandesOmarInstalled'
          $setup=Join-Path $env:GITHUB_WORKSPACE 'BashmohandesOmar_Setup_v9.exe'
          $p=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $exe=Join-Path $dir 'BashmohandesOmar.exe'
          if (-not (Test-Path $exe)) { throw 'Installed EXE missing' }
          $b=[IO.File]::ReadAllBytes($exe)
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw 'Installed EXE invalid' }

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: BashmohandesOmar-Windows10-Setup-v9
          path: BashmohandesOmar_Setup_v9.exe
          if-no-files-found: error
          retention-days: 30
