name: Validate Android 5+ APK

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.head_ref == 'build/android5plus-iconfix-v106'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Extract native Android project
        run: |
          rm -rf android-native
          mkdir android-native
          unzip -q android5plus-source.zip -d android-native

      - name: Apply v1.0.10 real launcher activity and splash
        run: |
          set -e
          APP=android-native/app/src/main
          PKG=$APP/java/com/waraqawqalam/store
          mkdir -p "$APP/res/drawable-nodpi" "$APP/res/values" "$APP/res/values-v31"

          cp native-overrides/store_logo.jpg "$APP/res/drawable-nodpi/store_logo.jpg"
          find "$APP/res" -type f \( -name 'ic_launcher*' -o -name 'ic_store*' -o -name 'ic_launcher_foreground*' \) -delete || true

          cat > "$PKG/LauncherV110Activity.java" <<'JAVA'
          package com.waraqawqalam.store;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          public class LauncherV110Activity extends Activity {
              private boolean opened = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.store_logo);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  logo.setAlpha(0f);
                  logo.setScaleX(0.68f);
                  logo.setScaleY(0.68f);

                  int size = (int) (285 * getResources().getDisplayMetrics().density);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(size, size, Gravity.CENTER);
                  root.addView(logo, lp);
                  setContentView(root);

                  logo.animate()
                      .alpha(1f)
                      .scaleX(1f)
                      .scaleY(1f)
                      .setDuration(700)
                      .withEndAction(() -> root.postDelayed(this::openStore, 300))
                      .start();
              }

              private void openStore() {
                  if (opened) return;
                  opened = true;
                  Intent next = new Intent(this, MainActivity.class);
                  Uri data = getIntent().getData();
                  if (data != null) next.setData(data);
                  startActivity(next);
                  overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out);
                  finish();
              }
          }
          JAVA

          cat > "$APP/res/values/splash_styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="SplashTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          XML

          cat > "$APP/res/values-v31/splash_styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="SplashTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:windowSplashScreenBackground">@android:color/white</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/store_logo</item>
                  <item name="android:windowSplashScreenAnimationDuration">200</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          XML

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='android-native/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          ns='{http://schemas.android.com/apk/res/android}'
          tree=ET.parse(p)
          root=tree.getroot()
          app=root.find('application')

          app.set(ns+'icon','@drawable/store_logo')
          app.set(ns+'roundIcon','@drawable/store_logo')
          app.set(ns+'usesCleartextTraffic','true')

          # Remove every old MAIN/LAUNCHER filter and all aliases.
          for act in list(app.findall('activity')):
              for filt in list(act.findall('intent-filter')):
                  actions=[x.get(ns+'name') for x in filt.findall('action')]
                  cats=[x.get(ns+'name') for x in filt.findall('category')]
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      act.remove(filt)
          for alias in list(app.findall('activity-alias')):
              app.remove(alias)

          # Remove previous custom launcher/splash activities from manifest, if any.
          for act in list(app.findall('activity')):
              name=act.get(ns+'name','')
              if name in ('.SplashActivity','.LauncherV109','.LauncherV110Activity','com.waraqawqalam.store.SplashActivity','com.waraqawqalam.store.LauncherV110Activity'):
                  app.remove(act)

          # New REAL launcher Activity. New component name busts OEM launcher icon cache.
          launch=ET.Element('activity')
          launch.set(ns+'name','.LauncherV110Activity')
          launch.set(ns+'exported','true')
          launch.set(ns+'enabled','true')
          launch.set(ns+'theme','@style/SplashTheme')
          launch.set(ns+'icon','@drawable/store_logo')
          launch.set(ns+'roundIcon','@drawable/store_logo')
          launch.set(ns+'label','@string/app_name')
          f=ET.SubElement(launch,'intent-filter')
          a=ET.SubElement(f,'action'); a.set(ns+'name','android.intent.action.MAIN')
          c=ET.SubElement(f,'category'); c.set(ns+'name','android.intent.category.LAUNCHER')
          app.insert(0,launch)

          tree.write(p,encoding='utf-8',xml_declaration=True)
          PY

          sed -i 's/import android.webkit.SslError;/import android.net.http.SslError;/' "$PKG/MainActivity.java"
          sed -i 's/WebSettings.MIXED_CONTENT_NEVER_ALLOW/WebSettings.MIXED_CONTENT_ALWAYS_ALLOW/g' "$PKG/MainActivity.java" || true
          sed -i 's/s.setJavaScriptEnabled(true);/s.setJavaScriptEnabled(true); s.setCacheMode(WebSettings.LOAD_NO_CACHE); s.setBlockNetworkImage(false);/' "$PKG/MainActivity.java" || true

          sed -i 's/versionCode = 2/versionCode = 11/' android-native/app/build.gradle.kts
          sed -i 's/versionName = "1.0.1"/versionName = "1.0.10"/' android-native/app/build.gradle.kts

          grep -n 'LauncherV110Activity\|store_logo\|LAUNCHER' "$APP/AndroidManifest.xml"
          if find "$APP/res" -type f \( -name 'ic_launcher*' -o -name 'ic_store*' -o -name 'ic_launcher_foreground*' \) | grep .; then
            echo 'ERROR: old launcher resources still exist'; exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Export apksigner tool
        run: |
          mkdir -p apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" apksigner-tool/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner-tool/lib/apksigner.jar
          chmod +x apksigner-tool/apksigner

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-36-v110
          path: apksigner-tool
          if-no-files-found: error

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify Android sees exact launcher icon
        run: |
          set -e
          APK=android-native/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'res/drawable-nodpi-v4/store_logo.jpg'
          if unzip -l "$APK" | grep -E 'ic_launcher|ic_store|ic_launcher_foreground'; then
            echo 'ERROR: old Android Studio icon resource packaged'; exit 1
          fi
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E 'package:|application:|launchable-activity'
          echo "$BADGING" | grep "launchable-activity: name='com.waraqawqalam.store.LauncherV110Activity'"
          echo "$BADGING" | grep "launchable-activity:.*icon='res/drawable-nodpi-v4/store_logo.jpg'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E 'LauncherV110Activity|store_logo'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaraqaWaQalam-Android5Plus-v1.0.10-RealLauncherLogo
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
