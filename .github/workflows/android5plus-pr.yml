name: Validate Android 5+ APK

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.head_ref == 'build/android5plus-iconfix-v106'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Extract native Android project
        run: |
          set -euo pipefail
          rm -rf android-native
          mkdir android-native
          unzip -q android5plus-source.zip -d android-native

      - name: Apply final adaptive icon and native splash
        run: |
          set -euo pipefail
          APP=android-native/app/src/main
          PKG=$APP/java/com/waraqawqalam/store

          python3 -m pip install --quiet pillow

          # Remove every legacy launcher/splash resource that could win resource selection.
          find "$APP/res" -type f \( -name 'ic_launcher*' -o -name 'ic_store*' -o -name 'ic_splash_logo*' \) -delete || true
          mkdir -p \
            "$APP/res/mipmap-mdpi" \
            "$APP/res/mipmap-hdpi" \
            "$APP/res/mipmap-xhdpi" \
            "$APP/res/mipmap-xxhdpi" \
            "$APP/res/mipmap-xxxhdpi" \
            "$APP/res/mipmap-anydpi-v26" \
            "$APP/res/drawable" \
            "$APP/res/drawable-xxxhdpi" \
            "$APP/res/values" \
            "$APP/res/values-v31"

          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          app = Path('android-native/app/src/main')
          src_path = Path('native-overrides/store_logo.jpg')
          src = Image.open(src_path).convert('RGBA')

          # Find the actual circular artwork and remove only the outside white canvas.
          rgb = src.convert('RGB')
          mask = Image.new('L', src.size, 0)
          mp = mask.load(); px = rgb.load()
          for y in range(src.height):
              for x in range(src.width):
                  r, g, b = px[x, y]
                  if min(r, g, b) < 245:
                      mp[x, y] = 255
          bbox = mask.getbbox()
          if not bbox:
              raise SystemExit('Logo content could not be detected')
          l, t, r, b = bbox
          pad = 8
          l = max(0, l-pad); t = max(0, t-pad)
          r = min(src.width, r+pad); b = min(src.height, b+pad)
          crop = src.crop((l, t, r, b))
          side = max(crop.size)
          square = Image.new('RGBA', (side, side), (0,0,0,0))
          square.alpha_composite(crop, ((side-crop.width)//2, (side-crop.height)//2))
          circle = Image.new('L', (side, side), 0)
          ImageDraw.Draw(circle).ellipse((0,0,side-1,side-1), fill=255)
          square.putalpha(circle)

          navy = (15, 31, 51, 255)
          densities = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          adaptive_sizes = {
              'mdpi': 108,
              'hdpi': 162,
              'xhdpi': 216,
              'xxhdpi': 324,
              'xxxhdpi': 432,
          }

          # Legacy icons: transparent corners, branded navy circle, full official logo.
          for density, size in densities.items():
              out_dir = app / 'res' / f'mipmap-{density}'
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = Image.new('RGBA', (size, size), (0,0,0,0))
              ImageDraw.Draw(icon).ellipse((0,0,size-1,size-1), fill=navy)
              d = max(1, round(size * 0.90))
              art = square.resize((d,d), Image.Resampling.LANCZOS)
              icon.alpha_composite(art, ((size-d)//2, (size-d)//2))
              icon.save(out_dir / 'ic_launcher.png', optimize=True)
              icon.save(out_dir / 'ic_launcher_round.png', optimize=True)

          # Adaptive foreground: keep complete logo inside the safe zone to prevent clipping.
          for density, size in adaptive_sizes.items():
              out_dir = app / 'res' / f'mipmap-{density}'
              fg = Image.new('RGBA', (size, size), (0,0,0,0))
              d = max(1, round(size * 0.69))
              art = square.resize((d,d), Image.Resampling.LANCZOS)
              fg.alpha_composite(art, ((size-d)//2, (size-d)//2))
              fg.save(out_dir / 'ic_launcher_foreground.png', optimize=True)

          # Pre-Android-12 launch window logo. 720px in xxxhdpi = 180dp.
          splash = square.resize((720,720), Image.Resampling.LANCZOS)
          splash.save(app / 'res' / 'drawable-xxxhdpi' / 'splash_logo.png', optimize=True)
          PY

          cat > "$APP/res/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML

          cat > "$APP/res/mipmap-anydpi-v26/ic_launcher_round.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML

          cat > "$APP/res/values/icon_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_background">#0F1F33</color>
          </resources>
          XML

          cat > "$APP/res/drawable/splash_window.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/navy" />
              <item android:gravity="center">
                  <bitmap android:src="@drawable/splash_logo" android:gravity="center" />
              </item>
          </layer-list>
          XML

          # Normal Android 12+ app theme must NOT point at the old launcher resource.
          cat > "$APP/res/values-v31/styles.xml" <<'XML'
          <resources>
              <style name="Theme.WaraqaWaQalam" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/navy</item>
                  <item name="android:navigationBarColor">@color/white</item>
                  <item name="android:windowBackground">@color/paper</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          XML

          cat > "$APP/res/values/splash_styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.WaraqaWaQalam.Splash" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_window</item>
                  <item name="android:statusBarColor">@color/navy</item>
                  <item name="android:navigationBarColor">@color/navy</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          cat > "$APP/res/values-v31/splash_styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.WaraqaWaQalam.Splash" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/navy</item>
                  <item name="android:windowSplashScreenBackground">@color/navy</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@android:color/transparent</item>
                  <item name="android:windowSplashScreenAnimationDuration">150</item>
                  <item name="android:statusBarColor">@color/navy</item>
                  <item name="android:navigationBarColor">@color/navy</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          cat > "$PKG/SplashActivity.java" <<'JAVA'
          package com.waraqawqalam.store;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          public class SplashActivity extends Activity {
              private boolean opened;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(15, 31, 51));
                  getWindow().setNavigationBarColor(Color.rgb(15, 31, 51));

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(15, 31, 51));

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_logo);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  logo.setScaleX(0.62f);
                  logo.setScaleY(0.62f);
                  logo.setAlpha(0.88f);

                  int size = dp(230);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(size, size, Gravity.CENTER);
                  root.addView(logo, lp);
                  setContentView(root);

                  logo.animate()
                      .scaleX(1.0f)
                      .scaleY(1.0f)
                      .alpha(1.0f)
                      .setInterpolator(new AccelerateDecelerateInterpolator())
                      .setDuration(720)
                      .withEndAction(this::openStore)
                      .start();
              }

              private void openStore() {
                  if (opened) return;
                  opened = true;
                  Intent next = new Intent(this, MainActivity.class);
                  Uri data = getIntent().getData();
                  if (data != null) next.setData(data);
                  next.putExtra("skip_internal_splash", true);
                  startActivity(next);
                  overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out);
                  finish();
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          app = Path('android-native/app/src/main')
          pkg = app / 'java/com/waraqawqalam/store'

          # Disable only the old in-MainActivity splash so the new native splash does not play twice.
          main = pkg / 'MainActivity.java'
          s = main.read_text(encoding='utf-8')
          old = '''        splashLayer = makeAnimatedSplash();\n        root.addView(splashLayer, new FrameLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT,\n                ViewGroup.LayoutParams.MATCH_PARENT));\n\n        setContentView(root);\n        startSplashAnimation();'''
          new = '''        splashLayer = null;\n        setContentView(root);'''
          if old not in s:
              raise SystemExit('Expected legacy MainActivity splash block not found')
          s = s.replace(old, new, 1)
          main.write_text(s, encoding='utf-8')

          manifest = app / 'AndroidManifest.xml'
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          ns = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(manifest)
          root = tree.getroot()
          application = root.find('application')
          application.set(ns+'icon', '@mipmap/ic_launcher')
          application.set(ns+'roundIcon', '@mipmap/ic_launcher_round')

          # Remove all stale launcher activities/aliases from previous attempts.
          for alias in list(application.findall('activity-alias')):
              application.remove(alias)
          for act in list(application.findall('activity')):
              name = act.get(ns+'name','')
              if name == '.SplashActivity' or name.startswith('.LauncherV') or name.startswith('com.waraqawqalam.store.LauncherV'):
                  application.remove(act)

          # MainActivity remains functionally untouched except its obsolete splash overlay.
          # All external entry points now pass through SplashActivity first.
          main_act = None
          for act in application.findall('activity'):
              if act.get(ns+'name') in ('.MainActivity','com.waraqawqalam.store.MainActivity'):
                  main_act = act
                  break
          if main_act is None:
              raise SystemExit('MainActivity not found in manifest')
          for filt in list(main_act.findall('intent-filter')):
              main_act.remove(filt)

          splash = ET.Element('activity')
          splash.set(ns+'name', '.SplashActivity')
          splash.set(ns+'exported', 'true')
          splash.set(ns+'theme', '@style/Theme.WaraqaWaQalam.Splash')
          splash.set(ns+'icon', '@mipmap/ic_launcher')
          splash.set(ns+'roundIcon', '@mipmap/ic_launcher_round')
          splash.set(ns+'label', '@string/app_name')

          launcher = ET.SubElement(splash, 'intent-filter')
          a = ET.SubElement(launcher, 'action'); a.set(ns+'name','android.intent.action.MAIN')
          c = ET.SubElement(launcher, 'category'); c.set(ns+'name','android.intent.category.LAUNCHER')

          deep = ET.SubElement(splash, 'intent-filter')
          deep.set(ns+'autoVerify', 'true')
          a = ET.SubElement(deep, 'action'); a.set(ns+'name','android.intent.action.VIEW')
          c = ET.SubElement(deep, 'category'); c.set(ns+'name','android.intent.category.DEFAULT')
          c = ET.SubElement(deep, 'category'); c.set(ns+'name','android.intent.category.BROWSABLE')
          d = ET.SubElement(deep, 'data'); d.set(ns+'scheme','https'); d.set(ns+'host','waraqawqalam.com')
          application.insert(0, splash)
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          gradle = Path('android-native/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 12', g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.11"', g, count=1)
          gradle.write_text(g, encoding='utf-8')
          PY

          # Pre-build root-cause checks: the old vector/placeholder resources must be gone.
          test ! -e "$APP/res/mipmap/ic_launcher.xml"
          test ! -e "$APP/res/mipmap/ic_launcher_round.xml"
          test ! -e "$APP/res/drawable/ic_launcher_foreground.xml"
          test ! -e "$APP/res/drawable/ic_splash_logo.xml"
          test -e "$APP/res/mipmap-anydpi-v26/ic_launcher.xml"
          test -e "$APP/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          test -e "$PKG/SplashActivity.java"
          grep -n 'SplashActivity\|@mipmap/ic_launcher\|LAUNCHER' "$APP/AndroidManifest.xml"
          grep -R "windowSplashScreenAnimatedIcon" -n "$APP/res/values-v31"

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          app=Path('android-native/app/src/main/res')
          expected={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          adaptive={'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}
          for d,s in expected.items():
              p=app/f'mipmap-{d}'/'ic_launcher.png'
              im=Image.open(p)
              assert im.size==(s,s), (p,im.size)
              assert im.mode=='RGBA'
              assert im.getpixel((0,0))[3]==0, 'legacy icon corner must be transparent'
          for d,s in adaptive.items():
              p=app/f'mipmap-{d}'/'ic_launcher_foreground.png'
              im=Image.open(p)
              assert im.size==(s,s), (p,im.size)
              assert im.mode=='RGBA'
              assert im.getpixel((0,0))[3]==0, 'adaptive foreground corner must be transparent'
          print('Icon matrix validated for legacy + adaptive densities')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Lint and build final release APK
        working-directory: android-native
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Inspect final APK resources and manifest
        run: |
          set -euo pipefail
          APK=android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"

          LIST=$(unzip -l "$APK")
          echo "$LIST" | grep -E 'mipmap-anydpi-v26.*ic_launcher.xml'
          echo "$LIST" | grep -E 'mipmap-anydpi-v26.*ic_launcher_round.xml'
          echo "$LIST" | grep -E 'mipmap-xxxhdpi.*ic_launcher_foreground.png'
          echo "$LIST" | grep -E 'drawable-xxxhdpi.*splash_logo.png'
          if echo "$LIST" | grep -E 'ic_splash_logo.xml|res/mipmap-v4/ic_launcher.xml|res/drawable/ic_launcher_foreground.xml'; then
            echo 'ERROR: stale launcher/splash resource packaged'; exit 1
          fi

          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E 'package:|application:|launchable-activity'
          echo "$BADGING" | grep "package: name='com.waraqawqalam.store' versionCode='12' versionName='1.0.11'"
          echo "$BADGING" | grep "launchable-activity: name='com.waraqawqalam.store.SplashActivity'"

          MANIFEST=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK")
          echo "$MANIFEST" | grep -E 'SplashActivity|Theme.WaraqaWaQalam.Splash'

          RES=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$APK")
          echo "$RES" | grep -E 'mipmap/ic_launcher$|mipmap/ic_launcher_round$|mipmap/ic_launcher_foreground$|drawable/splash_logo$|style/Theme.WaraqaWaQalam.Splash$'

          cat > final-validation.txt <<EOF
          Package: com.waraqawqalam.store
          Version: 1.0.11 (12)
          Launcher: com.waraqawqalam.store.SplashActivity
          Legacy icon densities: mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi
          Adaptive icon: present in mipmap-anydpi-v26 with dedicated foreground/background
          Android 12+ native splash: uses the official launcher foreground on branded background
          Custom splash animation: SplashActivity scales logo 0.62 -> 1.0 over 720ms
          Old launcher vector/splash placeholders: removed before build and absent from APK checks
          Main store logic: unchanged apart from disabling the obsolete duplicate in-activity splash overlay
          EOF
          cat final-validation.txt

      - name: Upload final unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: WaraqaWaQalam-v1.0.11-FinalAdaptiveIconSplash
          path: |
            android-native/app/build/outputs/apk/release/app-release-unsigned.apk
            final-validation.txt
          if-no-files-found: error
