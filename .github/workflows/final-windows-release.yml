name: Build and Publish Final Windows Release

on:
  push:
    branches:
      - final-windows-v91-test2
    paths:
      - 'windows-builder/**'
      - '.github/workflows/final-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Prepare verified final patch
        shell: pwsh
        run: |
          python .\windows-builder\repair_chunk.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item 'windows-builder/final_patch.b64.*' -Force -ErrorAction SilentlyContinue
          $parts = Get-ChildItem 'windows-builder/final_clean.b64.*' | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 clean patch parts, found $($parts.Count)" }
          for ($i=0; $i -lt $parts.Count; $i++) {
            Copy-Item $parts[$i].FullName ("windows-builder/final_patch.b64.{0}" -f $i) -Force
          }

      - name: Build test package
        shell: pwsh
        run: .\windows-builder\final_ci.ps1

      - name: Verify final output files
        shell: pwsh
        run: |
          $required = @('Program-Source-Final.zip','Program-Setup-Final.exe','Program-Portable-Final.zip')
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing final file: $f" }
            if ((Get-Item $f).Length -lt 1024) { throw "Invalid final file: $f" }
            Get-FileHash $f -Algorithm SHA256
          }

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-v9.1-final *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete windows-v9.1-final --cleanup-tag -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release create windows-v9.1-final `
            'Program-Source-Final.zip' `
            'Program-Setup-Final.exe' `
            'Program-Portable-Final.zip' `
            --title 'الباشمهندس عمر - Windows Final v9.1' `
            --notes 'Verified Windows 10/11 x64 final release. Source, Setup and Portable were created only after source runtime, EXE runtime, installer, shortcuts and uninstall checks passed.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: BashmohandesOmar-Final-Windows-v9.1
          path: |
            Program-Source-Final.zip
            Program-Setup-Final.exe
            Program-Portable-Final.zip
          if-no-files-found: error
          retention-days: 30
