name: Google Play AAB Readiness Audit

on:
  pull_request:
    branches: [main]

jobs:
  play-audit:
    if: github.head_ref == 'build/android5plus-iconfix-v106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild final validated Android source
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/android-final-logo-v3.yml').read_text(encoding='utf-8'))
          step=next(s for s in wf['jobs']['build']['steps'] if s.get('name')=='Prepare final Android source')
          Path('/tmp/prepare-final-android.sh').write_text(step['run'], encoding='utf-8')
          PY
          bash /tmp/prepare-final-android.sh

      - name: Apply Android 16 and Play readiness fixes
        run: |
          set -euo pipefail
          APP=android-native/app/src/main
          cp native-overrides/MainActivity.java "$APP/java/com/waraqawqalam/store/MainActivity.java"

          python3 - <<'PY'
          from pathlib import Path
          import re
          # API 23-only status bar flag must not live in base values when minSdk is 21.
          for rel in ['values/styles.xml','values/splash_styles.xml']:
              p=Path('android-native/app/src/main/res')/rel
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<item name="android:windowLightStatusBar">false</item>','',s)
              p.write_text(s,encoding='utf-8')
          # Add monochrome layer to adaptive icons for current Android themed icons.
          for rel in ['mipmap-anydpi-v26/ic_launcher.xml','mipmap-anydpi-v26/ic_launcher_round.xml']:
              p=Path('android-native/app/src/main/res')/rel
              s=p.read_text(encoding='utf-8')
              if '<monochrome ' not in s:
                  s=s.replace('</adaptive-icon>','<monochrome android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>')
              p.write_text(s,encoding='utf-8')
          PY

          # The dedicated launcher SplashActivity is now the only in-app logo animation.
          ! grep -q 'makeAnimatedSplash' "$APP/java/com/waraqawqalam/store/MainActivity.java"
          grep -q 'registerOnBackInvokedCallback' "$APP/java/com/waraqawqalam/store/MainActivity.java"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Strict release lint
        working-directory: android-native
        run: gradle :app:lintRelease --stacktrace

      - name: Build final APK and AAB
        working-directory: android-native
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Audit Play-facing manifest, permissions and bundle
        run: |
          set -euo pipefail
          APK=android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=android-native/app/build/outputs/bundle/release/app-release.aab
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -s "$APK"
          test -s "$AAB"
          grep -q 'minSdk = 21' android-native/app/build.gradle.kts
          grep -q 'targetSdk = 36' android-native/app/build.gradle.kts

          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" > play-badging.txt
          printf '%s\n' "$BADGING" | grep "package: name='com.waraqawqalam.store' versionCode='12' versionName='1.0.11'"
          printf '%s\n' "$BADGING" | grep "launchable-activity: name='com.waraqawqalam.store.SplashActivity'"

          printf '%s\n' "$BADGING" | grep '^uses-permission:' > play-permissions.txt || true
          echo '=== Declared permissions ==='
          cat play-permissions.txt || true
          if grep -E "(READ_SMS|SEND_SMS|RECEIVE_SMS|READ_CALL_LOG|WRITE_CALL_LOG|PROCESS_OUTGOING_CALLS|MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_BACKGROUND_LOCATION|READ_CONTACTS|WRITE_CONTACTS|BODY_SENSORS|READ_PHONE_STATE)" play-permissions.txt; then
            echo 'ERROR: high-risk/unneeded permission detected'; exit 1
          fi

          MANIFEST="$($AAPT dump xmltree --file AndroidManifest.xml "$APK")"
          printf '%s\n' "$MANIFEST" > play-manifest-tree.txt
          printf '%s\n' "$MANIFEST" | grep -F 'com.waraqawqalam.store.SplashActivity'
          printf '%s\n' "$MANIFEST" | grep -F 'com.waraqawqalam.store.MainActivity'

          unzip -l "$AAB" | grep -F 'base/manifest/AndroidManifest.xml'
          unzip -l "$AAB" | grep -F 'base/dex/classes.dex'
          unzip -l "$AAB" | grep -F 'base/resources.pb'

          cp android-native/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt lint-results-release.txt
          ERRORS=$(grep -c ' Error:' lint-results-release.txt || true)
          test "$ERRORS" -eq 0

          cat > PLAY_STORE_AUDIT.txt <<EOF
          Google Play technical audit: PASSED
          Package: com.waraqawqalam.store
          Version: 1.0.11 (12)
          minSdk: 21
          targetSdk: 36
          Launcher: SplashActivity
          Android App Bundle: generated successfully
          Release lint errors: 0
          Predictive back on Android 16: handled with OnBackInvokedDispatcher
          Duplicate MainActivity splash: removed
          API-23-only base style attributes: corrected
          Adaptive icon foreground/background/monochrome: present
          High-risk/unneeded permissions: none detected by audit list
          Note: Play Console declarations, privacy-policy URL, Data Safety, content rating, target audience, account-deletion requirements, developer verification, and proof of website ownership are policy/account requirements outside the Android binary.
          EOF
          cat PLAY_STORE_AUDIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WaraqaWaQalam-GooglePlay-v1.0.11-FINAL-AAB
          path: |
            android-native/app/build/outputs/bundle/release/app-release.aab
            PLAY_STORE_AUDIT.txt
            play-permissions.txt
            play-badging.txt
            play-manifest-tree.txt
            lint-results-release.txt
            android-native/app/build/reports/lint-results-release.html
          if-no-files-found: error
